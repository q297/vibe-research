# Public stand: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Caddy terminates HTTPS on 80/443, nothing else is published to the host
services:
  db:
    restart: unless-stopped

  api:
    restart: unless-stopped

  web:
    restart: unless-stopped
    ports: !reset []
    volumes:
      - ./deploy/nginx-real-ip.conf:/etc/nginx/proxy-trust/real-ip.conf:ro

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  caddy-data:
  caddy-config:
